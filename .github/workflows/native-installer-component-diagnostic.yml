name: BridgeX Installer Component Diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  component-diagnostic:
    runs-on: windows-latest
    env:
      CANONICAL_ARTIFACT_ID: '9405996175'
      WIX_VERSION: '6.0.0'
    steps:
      - uses: actions/checkout@v4

      - name: Download canonical runtime
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $env:RUNNER_TEMP 'canonical.zip'
          $dir = Join-Path $env:RUNNER_TEMP 'canonical'
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' }
          Invoke-WebRequest -Headers $headers -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/artifacts/$env:CANONICAL_ARTIFACT_ID/zip" -OutFile $zip -MaximumRedirection 8
          Expand-Archive -LiteralPath $zip -DestinationPath $dir -Force
          $portable = Join-Path $dir 'release-assets\TNSuiteBridgeX_260820_v0.5-Build12-Hotfix17-Full.zip'
          New-Item -ItemType Directory -Force -Path (Join-Path $PWD 'diag') | Out-Null
          Copy-Item -LiteralPath $portable -Destination (Join-Path $PWD 'diag\runtime.zip')

      - name: Build Hotfix22 MSI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet tool install --global wix --version $env:WIX_VERSION
          wix extension add -g "WixToolset.BootstrapperApplications.wixext/$env:WIX_VERSION"
          wix extension add -g "WixToolset.Util.wixext/$env:WIX_VERSION"
          & pwsh.exe -NoLogo -NoProfile -File .\.release\build-wix-installer-hotfix22.ps1 -PortableZip .\diag\runtime.zip -OutputDirectory .\diag
          if ($LASTEXITCODE -ne 0) { throw "HOTFIX22_BUILD_FAILED=$LASTEXITCODE" }

      - name: Query BridgeX component identity from MSI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $msi = (Resolve-Path '.\diag\TNSuiteBridgeX_260820_v0.5-Build12-Hotfix22-WiX.msi').Path
          $installer = New-Object -ComObject WindowsInstaller.Installer
          $db = $installer.OpenDatabase($msi, 0)

          $fileView = $db.OpenView("SELECT `File`,`Component_`,`FileName` FROM `File`")
          $fileView.Execute()
          $matches = @()
          while ($rec = $fileView.Fetch()) {
            $fileKey = $rec.StringData(1)
            $componentKey = $rec.StringData(2)
            $fileName = $rec.StringData(3)
            if ($fileName -match '(^|\|)BridgeX\.exe$') {
              $matches += [pscustomobject]@{ FileKey=$fileKey; ComponentKey=$componentKey; FileName=$fileName }
            }
          }
          if ($matches.Count -ne 1) { throw "BRIDGEX_FILE_ROW_COUNT=$($matches.Count)" }
          $componentKey = $matches[0].ComponentKey.Replace("'", "''")
          $componentView = $db.OpenView("SELECT `ComponentId`,`Directory_`,`KeyPath` FROM `Component` WHERE `Component`='$componentKey'")
          $componentView.Execute()
          $componentRec = $componentView.Fetch()
          if (-not $componentRec) { throw 'BRIDGEX_COMPONENT_ROW_MISSING' }
          $componentGuid = $componentRec.StringData(1)
          $directoryId = $componentRec.StringData(2)
          $keyPath = $componentRec.StringData(3)
          Write-Host "BRIDGEX_FILE_KEY=$($matches[0].FileKey)"
          Write-Host "BRIDGEX_COMPONENT_KEY=$($matches[0].ComponentKey)"
          Write-Host "BRIDGEX_COMPONENT_GUID=$componentGuid"
          Write-Host "BRIDGEX_COMPONENT_DIRECTORY=$directoryId"
          Write-Host "BRIDGEX_COMPONENT_KEYPATH=$keyPath"
          if ([string]::IsNullOrWhiteSpace($componentGuid)) { throw 'BRIDGEX_COMPONENT_GUID_EMPTY' }
          Write-Host 'BRIDGEX_COMPONENT_IDENTITY_DIAGNOSTIC=PASS'
