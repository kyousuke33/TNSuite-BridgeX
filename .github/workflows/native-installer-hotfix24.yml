name: BridgeX Hotfix24 Classic Branding

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  hotfix24-branding:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      WIX_VERSION: '6.0.0'
      BUILD16_NAME: 'TNSuiteBridgeX_260818_v0.5-Build12-Hotfix16-Full'
      HF24_SETUP_NAME: 'TNSuiteBridgeX_260821_v0.5-Build12-Hotfix24-WiX-Setup.exe'
      ICON_SHA256: '06266307acb6a92aca9742dac59dd053029075256a30eec50a37a71e08296328'
      SIDEBAR_SHA256: 'a54496bf465f8bc7e71269ad48b6c10e995656051c6c39a0c820ee0d30343de2'

    steps:
      - name: Checkout PR source
        uses: actions/checkout@v4

      - name: Prepare disposable Hotfix24 runtime build hooks
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $buildPath = '.\scripts\build-filezilla-dark.sh'
          $build = Get-Content -LiteralPath $buildPath -Raw -Encoding UTF8

          # The old BuildKit checked three large design/reference exports that were
          # deliberately removed from canonical source. Match the governed release
          # adapter: validate the current shipped branding contract instead.
          $brandingOld = @'
          log "Branding/UI asset QA - fail closed"
          python "$QA/branding_asset_check.py" "$KIT" | tee "$WORK/branding-asset-report.txt"
          grep -q '^BRANDING_ASSET_QA=PASS$' "$WORK/branding-asset-report.txt"
          '@
          $brandingNew = @'
          log "Canonical branding contract QA - fail closed"
          python "$KIT/scripts/qa/branding_contract_check.py" "$KIT" | tee "$WORK/branding-contract-report.txt"
          grep -q '^BRANDING_CONTRACT_QA=PASS$' "$WORK/branding-contract-report.txt"
          '@
          $brandingOld = $brandingOld -replace "`r`n", "`n"
          $brandingNew = $brandingNew -replace "`r`n", "`n"
          if (-not $build.Contains($brandingOld.Trim())) { throw 'HF24_BRANDING_CONTRACT_ADAPTER_ANCHOR_MISSING' }
          $build = $build.Replace($brandingOld.Trim(), $brandingNew.Trim())

          $patchNeedle = 'python "$KIT/scripts/patch_tnsuite_bridgex.py" "$SRC"'
          $patchReplacement = $patchNeedle + "`n" + 'python "$KIT/scripts/patch_tnsuite_bridgex_hotfix24.py" "$SRC"'
          if (-not $build.Contains($patchNeedle)) { throw 'HF24_RUNTIME_PATCH_HOOK_ANCHOR_MISSING' }
          $build = $build.Replace($patchNeedle, $patchReplacement)

          $exeNeedle = '[[ -s "$APP/bin/BridgeX.exe" ]] || { echo "ERROR: BridgeX.exe branding rename failed." >&2; exit 36; }'
          $exeReplacement = $exeNeedle + "`n" + @'
          BRIDGEX_APP_ICON_SOURCE="$KIT/assets/branding/BridgeX-AppIcon.ico"
          BRIDGEX_APP_ICON_RUNTIME="$APP/bin/BridgeX-AppIcon.ico"
          cp -f "$BRIDGEX_APP_ICON_SOURCE" "$BRIDGEX_APP_ICON_RUNTIME"
          [[ -s "$BRIDGEX_APP_ICON_RUNTIME" ]] || { echo "ERROR: BridgeX runtime icon missing." >&2; exit 47; }
          [[ "$(sha256sum "$BRIDGEX_APP_ICON_SOURCE" | awk '{print $1}')" == "$(sha256sum "$BRIDGEX_APP_ICON_RUNTIME" | awk '{print $1}')" ]] || { echo "ERROR: BridgeX runtime icon hash mismatch." >&2; exit 48; }
          echo "BRIDGEX_APP_ICON_RUNTIME_QA=PASS"
          '@
          if (-not $build.Contains($exeNeedle)) { throw 'HF24_RUNTIME_ICON_PACKAGE_ANCHOR_MISSING' }
          $build = $build.Replace($exeNeedle, $exeReplacement)
          [IO.File]::WriteAllText((Resolve-Path $buildPath), $build, [Text.UTF8Encoding]::new($false))

          $icon = '.\assets\branding\BridgeX-AppIcon.ico'
          $sidebar = '.\installer\BridgeX-Setup-Sidebar.bmp'
          if ((Get-FileHash -Algorithm SHA256 $icon).Hash.ToLowerInvariant() -ne $env:ICON_SHA256) { throw 'HF24_CANONICAL_ICON_HASH_FAIL' }
          if ((Get-FileHash -Algorithm SHA256 $sidebar).Hash.ToLowerInvariant() -ne $env:SIDEBAR_SHA256) { throw 'HF24_CLASSIC_SIDEBAR_HASH_FAIL' }
          Write-Host 'HF24_BUILD_HOOKS=PASS'
          Write-Host 'HF24_CANONICAL_BRANDING_ASSETS=PASS'

      - name: Build full BridgeX Windows runtime from source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\Build-TNSuiteBridgeX.ps1
          if ($LASTEXITCODE -ne 0) { throw "HF24_FULL_RUNTIME_BUILD_FAILED=$LASTEXITCODE" }
          $portable = Join-Path $PWD "dist\$env:BUILD16_NAME.zip"
          if (-not (Test-Path -LiteralPath $portable)) { throw "HF24_PORTABLE_MISSING=$portable" }

          # Validate Hotfix24-only runtime icon against the real package after the
          # baseline Hotfix12 synthetic payload fixture has completed unchanged.
          $probe = Join-Path $env:RUNNER_TEMP 'BridgeX-Hotfix24-PortableProbe'
          if (Test-Path $probe) { Remove-Item $probe -Recurse -Force }
          Expand-Archive -LiteralPath $portable -DestinationPath $probe -Force
          $runtimeIcon = Join-Path $probe 'bin\BridgeX-AppIcon.ico'
          if (-not (Test-Path -LiteralPath $runtimeIcon)) { throw 'HF24_PORTABLE_ICON_MISSING' }
          if ((Get-FileHash -Algorithm SHA256 $runtimeIcon).Hash.ToLowerInvariant() -ne $env:ICON_SHA256) { throw 'HF24_PORTABLE_ICON_HASH_FAIL' }
          Write-Host 'HF24_RUNTIME_ICON_PACKAGE_QA=PASS'
          Write-Host 'HF24_WINDOWS_COMPILE_QA=PASS'
          Write-Host "HF24_RUNTIME_PORTABLE=$portable"

      - name: Install pinned WiX extensions
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet tool install --global wix --version $env:WIX_VERSION
          if ($LASTEXITCODE -ne 0) { throw "WIX_TOOL_INSTALL_FAILED=$LASTEXITCODE" }
          wix extension add -g "WixToolset.BootstrapperApplications.wixext/$env:WIX_VERSION"
          wix extension add -g "WixToolset.Util.wixext/$env:WIX_VERSION"
          wix --version

      - name: Build Hotfix24 classic WiX installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $portable = Join-Path $PWD "dist\$env:BUILD16_NAME.zip"
          $out = Join-Path $PWD 'dist-hf24'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $qa = Join-Path $out 'TNSuiteBridgeX_260821_v0.5-Build12-Hotfix24-WiX-QA.txt'
          & pwsh.exe -NoLogo -NoProfile -File .\.release\build-wix-installer-hotfix24.ps1 -PortableZip $portable -OutputDirectory $out 2>&1 | Tee-Object -FilePath $qa
          if ($LASTEXITCODE -ne 0) { throw "HF24_WIX_BUILD_FAILED=$LASTEXITCODE" }
          $setup = Join-Path $out $env:HF24_SETUP_NAME
          if (-not (Test-Path -LiteralPath $setup)) { throw "HF24_SETUP_MISSING=$setup" }
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $setup).Hash.ToLowerInvariant()
          "HF24_SETUP_SHA256=$hash" | Tee-Object -FilePath $qa -Append
          Write-Host "HF24_SETUP_SHA256=$hash"

      - name: Verify installer uses original multi-resolution icon
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.Drawing.Common -ErrorAction SilentlyContinue
          if (-not ('System.Drawing.Icon' -as [type])) { Add-Type -AssemblyName System.Drawing }
          $setup = Join-Path $PWD "dist-hf24\$env:HF24_SETUP_NAME"
          $canonical = Resolve-Path '.\assets\branding\BridgeX-AppIcon.ico'
          $setupIcon = [System.Drawing.Icon]::ExtractAssociatedIcon($setup)
          if ($null -eq $setupIcon) { throw 'HF24_SETUP_ICON_EXTRACTION_FAIL' }
          $canonicalIcon = New-Object System.Drawing.Icon($canonical.Path, 32, 32)
          $a = $setupIcon.ToBitmap(); $b = $canonicalIcon.ToBitmap()
          try {
            if ($a.Width -ne $b.Width -or $a.Height -ne $b.Height) { throw "HF24_SETUP_ICON_SIZE_FAIL setup=$($a.Size) canonical=$($b.Size)" }
            $mismatch = 0
            for ($y=0; $y -lt $a.Height; $y++) { for ($x=0; $x -lt $a.Width; $x++) { if ($a.GetPixel($x,$y).ToArgb() -ne $b.GetPixel($x,$y).ToArgb()) { $mismatch++ } } }
            if ($mismatch -gt 0) { throw "HF24_SETUP_ICON_PIXEL_MISMATCH=$mismatch" }
          } finally { $a.Dispose(); $b.Dispose(); $setupIcon.Dispose(); $canonicalIcon.Dispose() }
          Write-Host 'HF24_SETUP_ICON_CANONICAL=PASS'

      - name: Install and verify Windows taskbar window icon
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Join-Path $PWD "dist-hf24\$env:HF24_SETUP_NAME"
          $base = Join-Path $env:RUNNER_TEMP 'BridgeX-Hotfix24-Taskbar'
          $root = Join-Path $base 'TNSuite\BridgeX'
          $exe = Join-Path $root 'bin\BridgeX.exe'
          $runtimeIcon = Join-Path $root 'bin\BridgeX-AppIcon.ico'
          if (Test-Path $base) { Remove-Item $base -Recurse -Force }
          $install = Start-Process -FilePath $setup -ArgumentList @('/quiet','/norestart',("InstallFolder={0}" -f $base),'CreateDesktopShortcut=0','LaunchAfterInstall=0') -Wait -PassThru
          if ($install.ExitCode -notin @(0,3010)) { throw "HF24_INSTALL_FAIL=$($install.ExitCode)" }
          if (-not (Test-Path $exe) -or -not (Test-Path $runtimeIcon)) { throw 'HF24_RUNTIME_ICON_PAYLOAD_MISSING' }
          if ((Get-FileHash -Algorithm SHA256 $runtimeIcon).Hash.ToLowerInvariant() -ne $env:ICON_SHA256) { throw 'HF24_INSTALLED_ICON_HASH_FAIL' }

          Add-Type @'
          using System;
          using System.Runtime.InteropServices;
          public static class BridgeXWindowIconProbe {
            [DllImport("user32.dll", CharSet=CharSet.Auto)] public static extern IntPtr SendMessage(IntPtr hWnd, uint Msg, IntPtr wParam, IntPtr lParam);
            [DllImport("user32.dll", EntryPoint="GetClassLongPtrW")] public static extern IntPtr GetClassLongPtr(IntPtr hWnd, int nIndex);
          }
          '@
          $p = Start-Process -FilePath $exe -WorkingDirectory (Split-Path $exe) -PassThru
          $deadline = (Get-Date).AddSeconds(20)
          do { Start-Sleep -Milliseconds 500; $p.Refresh() } while (-not $p.HasExited -and $p.MainWindowHandle -eq 0 -and (Get-Date) -lt $deadline)
          if ($p.HasExited -or $p.MainWindowHandle -eq 0) { throw 'HF24_MAIN_WINDOW_NOT_READY' }
          $WM_GETICON = 0x007F
          $hIcon = [BridgeXWindowIconProbe]::SendMessage($p.MainWindowHandle, $WM_GETICON, [IntPtr]1, [IntPtr]::Zero)
          if ($hIcon -eq [IntPtr]::Zero) { $hIcon = [BridgeXWindowIconProbe]::SendMessage($p.MainWindowHandle, $WM_GETICON, [IntPtr]0, [IntPtr]::Zero) }
          if ($hIcon -eq [IntPtr]::Zero) { $hIcon = [BridgeXWindowIconProbe]::GetClassLongPtr($p.MainWindowHandle, -14) }
          if ($hIcon -eq [IntPtr]::Zero) { throw 'HF24_TASKBAR_WINDOW_ICON_HANDLE_MISSING' }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          Write-Host 'HF24_TASKBAR_WINDOW_ICON=PASS'

          $remove = Start-Process -FilePath $setup -ArgumentList @('/uninstall','/quiet','/norestart') -Wait -PassThru
          if ($remove.ExitCode -ne 0) { throw "HF24_UNINSTALL_FAIL=$($remove.ExitCode)" }

      - name: Upload Hotfix24 candidate
        uses: actions/upload-artifact@v4
        with:
          name: bridgex-hotfix24-${{ github.event.pull_request.head.sha }}
          path: |
            dist-hf24/TNSuiteBridgeX_260821_v0.5-Build12-Hotfix24-WiX-Setup.exe
            dist-hf24/TNSuiteBridgeX_260821_v0.5-Build12-Hotfix24-WiX.msi
            dist-hf24/TNSuiteBridgeX_260821_v0.5-Build12-Hotfix24-WiX-QA.txt
          if-no-files-found: error
          retention-days: 7
