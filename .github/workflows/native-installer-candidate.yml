name: BridgeX WiX Installer Candidate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  wix-installer:
    runs-on: windows-latest
    env:
      CANONICAL_ARTIFACT_ID: '9405996175'
      CANONICAL_SOURCE_SHA: '5c9d70673d9b5da4a4878c9ce548077f0ef67539'
      WIX_VERSION: '6.0.0'
      EXPECTED_BRIDGEX_SHA256: '9d528d211950f3df0609c05a8c1e01725927ae76b70bed2ad0fe9b97c53504d6'

    steps:
      - name: Checkout exact PR source
        uses: actions/checkout@v4

      - name: Download canonical main runtime artifact
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $artifactZip = Join-Path $env:RUNNER_TEMP 'bridgex-canonical-artifact.zip'
          $artifactDir = Join-Path $env:RUNNER_TEMP 'bridgex-canonical-artifact'
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $uri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/artifacts/$env:CANONICAL_ARTIFACT_ID/zip"
          Invoke-WebRequest -Headers $headers -Uri $uri -OutFile $artifactZip -MaximumRedirection 8
          Expand-Archive -LiteralPath $artifactZip -DestinationPath $artifactDir -Force

          $portable = Join-Path $artifactDir 'release-assets\TNSuiteBridgeX_260820_v0.5-Build12-Hotfix17-Full.zip'
          if (-not (Test-Path -LiteralPath $portable)) { throw "CANONICAL_PORTABLE_MISSING=$portable" }
          New-Item -ItemType Directory -Force -Path (Join-Path $PWD 'dist') | Out-Null
          Copy-Item -LiteralPath $portable -Destination (Join-Path $PWD 'dist\TNSuiteBridgeX_260820_v0.5-Build12-Hotfix17-Full.zip') -Force
          Write-Host "WIX_INSTALLER_RUNTIME_SOURCE_SHA=$env:CANONICAL_SOURCE_SHA"
          Write-Host 'WIX_INSTALLER_RUNTIME_SOURCE=CANONICAL_MAIN_ARTIFACT'
          Write-Host 'WIX_INSTALLER_RUNTIME_SOURCE_QA=PASS'

      - name: Install pinned WiX Toolset
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet tool install --global wix --version $env:WIX_VERSION
          if ($LASTEXITCODE -ne 0) { throw "WIX_TOOL_INSTALL_FAILED=$LASTEXITCODE" }
          wix --version
          wix extension add -g "WixToolset.BootstrapperApplications.wixext/$env:WIX_VERSION"
          if ($LASTEXITCODE -ne 0) { throw "WIX_BOOTSTRAPPER_EXTENSION_INSTALL_FAILED=$LASTEXITCODE" }
          Write-Host "WIX_VERSION_PINNED=$env:WIX_VERSION"
          Write-Host 'WIX_TOOLCHAIN_QA=PASS'

      - name: Build branded Hotfix20 installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $portable = Join-Path $PWD 'dist\TNSuiteBridgeX_260820_v0.5-Build12-Hotfix17-Full.zip'
          $qa = Join-Path $PWD 'dist\TNSuiteBridgeX_260820_v0.5-Build12-Hotfix20-WiX-QA.txt'

          & pwsh.exe -NoLogo -NoProfile -File .\.release\build-wix-installer-hotfix20.ps1 `
            -PortableZip $portable `
            -OutputDirectory (Join-Path $PWD 'dist') 2>&1 | Tee-Object -FilePath $qa
          if ($LASTEXITCODE -ne 0) { throw "WIX_INSTALLER_BUILD_FAILED=$LASTEXITCODE" }

          $msi = Join-Path $PWD 'dist\TNSuiteBridgeX_260820_v0.5-Build12-Hotfix20-WiX.msi'
          $setup = Join-Path $PWD 'dist\TNSuiteBridgeX_260820_v0.5-Build12-Hotfix20-WiX-Setup.exe'
          foreach ($artifact in @($msi, $setup)) {
            if (-not (Test-Path -LiteralPath $artifact)) { throw "WIX_ARTIFACT_MISSING=$artifact" }
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $artifact).Hash.ToLowerInvariant()
            "ARTIFACT_SHA256 file=$([System.IO.Path]::GetFileName($artifact)) sha256=$hash" | Tee-Object -FilePath $qa -Append
          }

          try { Add-Type -AssemblyName System.Drawing.Common -ErrorAction Stop } catch { Add-Type -AssemblyName System.Drawing }
          $setupIcon = [System.Drawing.Icon]::ExtractAssociatedIcon($setup)
          if ($null -eq $setupIcon -or $setupIcon.Width -lt 16 -or $setupIcon.Height -lt 16) { throw 'SETUP_EXE_ICON_RESOURCE=FAIL' }
          Write-Host "SETUP_EXE_ICON_RESOURCE=PASS size=$($setupIcon.Width)x$($setupIcon.Height)"
          $setupIcon.Dispose()

          $theme = Get-Content -LiteralPath '.\.release\BridgeX.Hotfix20.Theme.xml' -Raw
          if ($theme -notmatch 'Editbox Name="InstallBaseFolder"') { throw 'BASE_FOLDER_EDITBOX_BINDING=FAIL' }
          if ($theme -notmatch 'BrowseDirectoryAction VariableName="InstallBaseFolder"') { throw 'BASE_FOLDER_BROWSE_BINDING=FAIL' }
          Write-Host 'BASE_FOLDER_EDITBOX_BINDING=PASS'
          Write-Host 'BASE_FOLDER_BROWSE_BINDING=PASS'
          Write-Host 'AUTO_SUBFOLDER_UI_HINT=PASS'
          Write-Host 'INSTALLER_BRANDING_QA=PASS'
          Write-Host 'WIX_INSTALLER_CANDIDATE_QA=PASS'

      - name: Microsoft Defender scan request
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $defender = Join-Path $env:ProgramFiles 'Windows Defender\MpCmdRun.exe'
          if (-not (Test-Path -LiteralPath $defender)) {
            $platformRoot = Join-Path $env:ProgramData 'Microsoft\Windows Defender\Platform'
            $latest = Get-ChildItem -LiteralPath $platformRoot -Directory | Sort-Object Name -Descending | Select-Object -First 1
            if ($latest) { $defender = Join-Path $latest.FullName 'MpCmdRun.exe' }
          }
          if (-not (Test-Path -LiteralPath $defender)) { throw 'MICROSOFT_DEFENDER_CLI_MISSING' }

          $targets = @(
            (Join-Path $PWD 'dist\TNSuiteBridgeX_260820_v0.5-Build12-Hotfix20-WiX.msi'),
            (Join-Path $PWD 'dist\TNSuiteBridgeX_260820_v0.5-Build12-Hotfix20-WiX-Setup.exe')
          )
          foreach ($target in $targets) {
            $scanOutput = @(& $defender -Scan -ScanType 3 -File $target 2>&1)
            $scanOutput | ForEach-Object { Write-Host $_ }
            if ($LASTEXITCODE -ne 0) { throw "MICROSOFT_DEFENDER_SCAN_REQUEST=FAIL file=$target exit=$LASTEXITCODE" }
            if (($scanOutput -join "`n") -match 'was skipped') {
              Write-Host "MICROSOFT_DEFENDER_SCAN_RESULT=NOT_VERIFIED_SKIPPED file=$([System.IO.Path]::GetFileName($target))"
            } else {
              Write-Host "MICROSOFT_DEFENDER_SCAN_RESULT=NO_THREAT_REPORTED file=$([System.IO.Path]::GetFileName($target))"
            }
          }

      - name: Default markerless migration and runtime QA
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Join-Path $PWD 'dist\TNSuiteBridgeX_260820_v0.5-Build12-Hotfix20-WiX-Setup.exe'
          $installRoot = Join-Path $env:ProgramFiles 'TNSuite\BridgeX'
          $legacySentinel = Join-Path $installRoot 'legacy-file-not-owned-by-wix.txt'
          $installedExe = Join-Path $installRoot 'bin\BridgeX.exe'

          if (Test-Path -LiteralPath $installRoot) { Remove-Item -LiteralPath $installRoot -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $installRoot | Out-Null
          Set-Content -LiteralPath $legacySentinel -Value 'legacy sentinel: installer must preserve this file' -NoNewline
          Write-Host 'MARKERLESS_LEGACY_FOLDER_PRECONDITION=PASS'

          $install = Start-Process -FilePath $setup -ArgumentList @('/quiet','/norestart') -Wait -PassThru
          if ($install.ExitCode -notin @(0, 3010)) { throw "DEFAULT_INSTALL=FAIL exit=$($install.ExitCode)" }
          if (-not (Test-Path -LiteralPath $installedExe)) { throw 'DEFAULT_INSTALLED_BRIDGEX_EXE_MISSING' }
          $actualHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $installedExe).Hash.ToLowerInvariant()
          if ($actualHash -ne $env:EXPECTED_BRIDGEX_SHA256) { throw "DEFAULT_INSTALLED_BRIDGEX_HASH=FAIL actual=$actualHash" }
          if (-not (Test-Path -LiteralPath $legacySentinel)) { throw 'LEGACY_UNOWNED_FILE_WAS_DELETED_DURING_INSTALL' }
          Write-Host "DEFAULT_LOCATION_INSTALL=PASS path=$installRoot"
          Write-Host "INSTALLED_BRIDGEX_HASH=PASS sha256=$actualHash"

          $bin = Split-Path -Parent $installedExe
          $runtime = Start-Process -FilePath $installedExe -WorkingDirectory $bin -PassThru
          Start-Sleep -Seconds 5
          if ($runtime.HasExited) { throw "DEFAULT_RUNTIME_LAUNCH=FAIL exit=$($runtime.ExitCode)" }
          Stop-Process -Id $runtime.Id -Force
          $runtime.WaitForExit()
          Write-Host 'DEFAULT_RUNTIME_LAUNCH=PASS'

          $uninstall = Start-Process -FilePath $setup -ArgumentList @('/uninstall','/quiet','/norestart') -Wait -PassThru
          if ($uninstall.ExitCode -notin @(0, 3010)) { throw "DEFAULT_UNINSTALL=FAIL exit=$($uninstall.ExitCode)" }
          if (Test-Path -LiteralPath $installedExe) { throw 'DEFAULT_MANAGED_FILE_REMAINS_AFTER_UNINSTALL' }
          if (-not (Test-Path -LiteralPath $legacySentinel)) { throw 'LEGACY_UNOWNED_FILE_WAS_DELETED_DURING_UNINSTALL' }
          Remove-Item -LiteralPath $installRoot -Recurse -Force
          Write-Host 'MARKERLESS_LEGACY_MIGRATION_QA=PASS'

      - name: Drive and parent-folder auto-subfolder QA
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Join-Path $PWD 'dist\TNSuiteBridgeX_260820_v0.5-Build12-Hotfix20-WiX-Setup.exe'
          $defaultRoot = Join-Path $env:ProgramFiles 'TNSuite\BridgeX'

          function Test-BaseLocation([string]$baseLocation, [string]$caseName) {
            $expectedRoot = Join-Path $baseLocation 'TNSuite\BridgeX'
            $installedExe = Join-Path $expectedRoot 'bin\BridgeX.exe'
            $wrongDirectExe = Join-Path $baseLocation 'bin\BridgeX.exe'
            $tnsuiteRoot = Join-Path $baseLocation 'TNSuite'

            if (Test-Path -LiteralPath $expectedRoot) { Remove-Item -LiteralPath $expectedRoot -Recurse -Force }
            if (Test-Path -LiteralPath $wrongDirectExe) { throw "$caseName`_PRECONDITION_WRONG_DIRECT_EXE_PRESENT=$wrongDirectExe" }
            if (Test-Path -LiteralPath $defaultRoot) { Remove-Item -LiteralPath $defaultRoot -Recurse -Force }

            $args = @('/quiet','/norestart',("InstallBaseFolder={0}" -f $baseLocation))
            $install = Start-Process -FilePath $setup -ArgumentList $args -Wait -PassThru
            if ($install.ExitCode -notin @(0, 3010)) { throw "$caseName`_INSTALL=FAIL exit=$($install.ExitCode)" }
            if (-not (Test-Path -LiteralPath $installedExe)) { throw "$caseName`_AUTO_SUBFOLDER_MISSING expected=$installedExe" }
            if (Test-Path -LiteralPath $wrongDirectExe) { throw "$caseName`_PAYLOAD_INSTALLED_DIRECTLY_IN_BASE path=$wrongDirectExe" }
            if (Test-Path -LiteralPath (Join-Path $defaultRoot 'bin\BridgeX.exe')) { throw "$caseName`_IGNORED_BASE_LOCATION" }

            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $installedExe).Hash.ToLowerInvariant()
            if ($hash -ne $env:EXPECTED_BRIDGEX_SHA256) { throw "$caseName`_HASH=FAIL actual=$hash" }
            Write-Host "$caseName`_AUTO_SUBFOLDER=PASS base=$baseLocation final=$expectedRoot"
            Write-Host "$caseName`_HASH=PASS sha256=$hash"

            $runtime = Start-Process -FilePath $installedExe -WorkingDirectory (Split-Path -Parent $installedExe) -PassThru
            Start-Sleep -Seconds 5
            if ($runtime.HasExited) { throw "$caseName`_RUNTIME=FAIL exit=$($runtime.ExitCode)" }
            Stop-Process -Id $runtime.Id -Force
            $runtime.WaitForExit()
            Write-Host "$caseName`_RUNTIME=PASS"

            $uninstall = Start-Process -FilePath $setup -ArgumentList @('/uninstall','/quiet','/norestart') -Wait -PassThru
            if ($uninstall.ExitCode -notin @(0, 3010)) { throw "$caseName`_UNINSTALL=FAIL exit=$($uninstall.ExitCode)" }
            if (Test-Path -LiteralPath $installedExe) { throw "$caseName`_MANAGED_FILE_REMAINS_AFTER_UNINSTALL" }
            if (Test-Path -LiteralPath $tnsuiteRoot) { Remove-Item -LiteralPath $tnsuiteRoot -Recurse -Force }
          }

          $driveRoot = [System.IO.Path]::GetPathRoot($env:RUNNER_TEMP)
          if (-not $driveRoot) { throw 'DRIVE_ROOT_RESOLUTION_FAILED' }
          Test-BaseLocation -baseLocation $driveRoot -caseName 'DRIVE_ROOT'

          $parentBase = Join-Path $env:RUNNER_TEMP 'BridgeX-Selected-Parent'
          New-Item -ItemType Directory -Force -Path $parentBase | Out-Null
          Test-BaseLocation -baseLocation $parentBase -caseName 'PARENT_FOLDER'
          if (Test-Path -LiteralPath $parentBase) { Remove-Item -LiteralPath $parentBase -Recurse -Force }

          Write-Host 'AUTO_SUBFOLDER_LOCATION_QA=PASS'

      - name: Upload WiX installer candidate
        uses: actions/upload-artifact@v4
        with:
          name: bridgex-wix-hotfix20-${{ github.event.pull_request.head.sha }}
          path: |
            dist/TNSuiteBridgeX_260820_v0.5-Build12-Hotfix20-WiX.msi
            dist/TNSuiteBridgeX_260820_v0.5-Build12-Hotfix20-WiX-Setup.exe
            dist/TNSuiteBridgeX_260820_v0.5-Build12-Hotfix20-WiX-QA.txt
          if-no-files-found: error
          retention-days: 7
