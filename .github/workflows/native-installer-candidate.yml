name: BridgeX Native Installer Candidate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  native-installer:
    runs-on: windows-latest
    env:
      CANONICAL_ARTIFACT_ID: '9405996175'
      CANONICAL_SOURCE_SHA: '5c9d70673d9b5da4a4878c9ce548077f0ef67539'
    steps:
      - name: Checkout exact PR source
        uses: actions/checkout@v4

      - name: Download canonical main runtime artifact
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $artifactZip = Join-Path $env:RUNNER_TEMP 'bridgex-canonical-artifact.zip'
          $artifactDir = Join-Path $env:RUNNER_TEMP 'bridgex-canonical-artifact'
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $uri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/artifacts/$env:CANONICAL_ARTIFACT_ID/zip"
          Invoke-WebRequest -Headers $headers -Uri $uri -OutFile $artifactZip -MaximumRedirection 8
          Expand-Archive -LiteralPath $artifactZip -DestinationPath $artifactDir -Force

          $portable = Join-Path $artifactDir 'release-assets\TNSuiteBridgeX_260820_v0.5-Build12-Hotfix17-Full.zip'
          if (-not (Test-Path -LiteralPath $portable)) { throw "CANONICAL_PORTABLE_MISSING=$portable" }
          New-Item -ItemType Directory -Force -Path (Join-Path $PWD 'dist') | Out-Null
          Copy-Item -LiteralPath $portable -Destination (Join-Path $PWD 'dist\TNSuiteBridgeX_260820_v0.5-Build12-Hotfix17-Full.zip') -Force
          Write-Host "NATIVE_INSTALLER_RUNTIME_SOURCE_SHA=$env:CANONICAL_SOURCE_SHA"
          Write-Host 'NATIVE_INSTALLER_RUNTIME_SOURCE=CANONICAL_MAIN_ARTIFACT'
          Write-Host 'NATIVE_INSTALLER_RUNTIME_SOURCE_QA=PASS'

      - name: Build native resource-based installer candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $portable = Join-Path $PWD 'dist\TNSuiteBridgeX_260820_v0.5-Build12-Hotfix17-Full.zip'
          $output = Join-Path $PWD 'dist\TNSuiteBridgeX_260820_v0.5-Build12-Hotfix17-RuntimeCompleteInstaller03-Native-Setup.exe'
          $qa = Join-Path $PWD 'dist\TNSuiteBridgeX_260820_v0.5-Build12-Hotfix17-RuntimeCompleteInstaller03-Native-QA.txt'

          & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\.release\build-native-installer-canonical.ps1 `
            -PortableZip $portable `
            -OutputExe $output 2>&1 | Tee-Object -FilePath $qa
          if ($LASTEXITCODE -ne 0) { throw "NATIVE_INSTALLER_BUILD_FAILED=$LASTEXITCODE" }

          if (-not (Test-Path -LiteralPath $output)) { throw 'NATIVE_INSTALLER_OUTPUT_MISSING' }
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $output).Hash.ToLowerInvariant()
          "NATIVE_INSTALLER_FINAL_SHA256=$hash" | Tee-Object -FilePath $qa -Append
          "NATIVE_INSTALLER_FILE_SIZE=$((Get-Item -LiteralPath $output).Length)" | Tee-Object -FilePath $qa -Append
          Write-Host 'NATIVE_INSTALLER_CANDIDATE_QA=PASS'

      - name: Upload native installer candidate
        uses: actions/upload-artifact@v4
        with:
          name: bridgex-native-installer-${{ github.event.pull_request.head.sha }}
          path: |
            dist/TNSuiteBridgeX_260820_v0.5-Build12-Hotfix17-RuntimeCompleteInstaller03-Native-Setup.exe
            dist/TNSuiteBridgeX_260820_v0.5-Build12-Hotfix17-RuntimeCompleteInstaller03-Native-QA.txt
          if-no-files-found: error
          retention-days: 7
