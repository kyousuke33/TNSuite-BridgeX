name: BridgeX Governance Gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  governance:
    runs-on: ubuntu-latest
    outputs:
      windows_build_required: ${{ steps.build-impact.outputs.windows_build_required }}
    steps:
      - uses: actions/checkout@v4

      - name: Public repository CI trust boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          workflow_root = Path('.github/workflows')
          forbidden = {
              'forbidden runner label': 'self' + '-hosted',
              'shared trusted CI host reference': 'tn-' + 'ci-01',
              'forbidden privileged PR event': 'pull_request' + '_target',
              'repository secret reference': 'secrets' + '.',
          }

          failures = []
          for path in sorted(list(workflow_root.glob('*.yml')) + list(workflow_root.glob('*.yaml'))):
              text = path.read_text(encoding='utf-8')
              for label, needle in forbidden.items():
                  if needle in text:
                      failures.append(f'{path}: {label}')

          if failures:
              for failure in failures:
                  print(f'PUBLIC_CI_TRUST=FAIL {failure}')
              raise SystemExit(1)

          print('BRIDGEX_PUBLIC_REPO=CONFIRMED')
          print('PUBLIC_PR_SELF_HOSTED_EXECUTION=NONE')
          print('FORK_PR_RUNNER=GITHUB_HOSTED')
          print('PULL_REQUEST_TARGET_UNTRUSTED_EXECUTION=NONE')
          print('CI_SECRET_EXPOSURE=NONE')
          print('TN_CI_01_WORKFLOW_ROUTING=NONE')
          PY

      - name: Required governed structure
        shell: bash
        run: |
          set -euo pipefail
          test -f AGENTS.md
          test -f docs/90_GOVERNANCE/CURRENT_STATE.md
          test -f .release/project.json
          test -f .release/source-gates.sh
          test -f skills/project-audit/SKILL.md
          echo GOVERNANCE_STRUCTURE_QA=PASS

      - name: Determine Windows build impact
        id: build-impact
        uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName !== 'pull_request') {
              core.setOutput('windows_build_required', 'true');
              core.info('WINDOWS_BUILD_IMPACT=REQUIRED reason=CANONICAL_MAIN_PUSH');
              return;
            }

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              per_page: 100,
            });

            const noBuildExact = new Set([
              'AGENTS.md',
              'README.md',
              'CONTRIBUTING.md',
              'CHANGELOG.md',
              'COPYING',
            ]);
            const isDocsOrGovernanceOnly = (path) =>
              path.startsWith('docs/') || noBuildExact.has(path);

            const changed = files.map((file) => file.filename);
            const buildImpacting = changed.filter((path) => !isDocsOrGovernanceOnly(path));
            const required = buildImpacting.length > 0;

            core.setOutput('windows_build_required', required ? 'true' : 'false');
            core.info(`WINDOWS_BUILD_IMPACT=${required ? 'REQUIRED' : 'NOT_REQUIRED'}`);
            core.info(`WINDOWS_BUILD_CHANGED_FILE_COUNT=${changed.length}`);
            core.info(`WINDOWS_BUILD_IMPACTING_FILE_COUNT=${buildImpacting.length}`);
            if (!required) {
              core.info('DOCS_GOVERNANCE_ONLY_BINARY_GENERATION=SKIPPED');
            }

      - name: Source gate
        run: bash .release/source-gates.sh

  windows-build-qa:
    name: Windows build QA (dry run)
    if: github.event_name == 'pull_request' && needs.governance.outputs.windows_build_required == 'true'
    needs: governance
    permissions:
      contents: read
    uses: ./.github/workflows/windows-release.yml
    with:
      source_sha: ${{ github.sha }}
      publish_release: false
      artifact_class: PR_TEST_EVIDENCE

  withdraw-hotfix16-release:
    name: Withdraw flagged Hotfix16 release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: governance
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete GitHub Release and tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag='v0.5-Build12-Hotfix16'
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
            echo 'HOTFIX16_RELEASE_WITHDRAWN=PASS'
          else
            echo 'HOTFIX16_RELEASE_ALREADY_ABSENT=PASS'
          fi

  windows-main-build-qa:
    name: Windows main build QA (publication paused)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [governance, withdraw-hotfix16-release]
    permissions:
      contents: read
    uses: ./.github/workflows/windows-release.yml
    with:
      source_sha: ${{ github.sha }}
      publish_release: false
      artifact_class: IMMUTABLE_RELEASE_CANDIDATE

  report-main-artifact:
    name: Report canonical main artifact
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.windows-main-build-qa.result == 'success'
    needs: [windows-main-build-qa]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Write artifact checkpoint to issue 18
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artifact_name="bridgex-release-${GITHUB_SHA}"
          run_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          cat > /tmp/bridgex-main-artifact.md <<EOF
          ## Canonical main Windows artifact available

          \`\`\`text
          CANONICAL_MAIN_SHA=${GITHUB_SHA}
          CANONICAL_MAIN_BUILD_RUN_ID=${GITHUB_RUN_ID}
          CANONICAL_MAIN_BUILD_RUN_URL=${run_url}
          CANONICAL_MAIN_ARTIFACT=${artifact_name}
          ARTIFACT_CLASS=IMMUTABLE_RELEASE_CANDIDATE
          ARTIFACT_RETENTION_DAYS=30
          WINDOWS_MAIN_BUILD_QA=PASS
          PUBLICATION_PAUSED=YES
          \`\`\`

          The artifact above is the only Build12-Hotfix17 candidate eligible for SHA-256 / VirusTotal verification and later governed promotion. PR dry-run artifacts use the separate `bridgex-pr-test-<sha>` family, expire after 2 days, and are not promotion authority.
          EOF
          gh issue comment 18 --repo "$GITHUB_REPOSITORY" --body-file /tmp/bridgex-main-artifact.md
          echo "CANONICAL_MAIN_ARTIFACT_REPORTED=${artifact_name}"
