name: BridgeX Hotfix23 Maintenance UX

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  hotfix23-installer:
    runs-on: windows-latest
    env:
      CANONICAL_ARTIFACT_ID: '9405996175'
      WIX_VERSION: '6.0.0'
      EXPECTED_BRIDGEX_SHA256: '9d528d211950f3df0609c05a8c1e01725927ae76b70bed2ad0fe9b97c53504d6'

    steps:
      - name: Checkout PR source
        uses: actions/checkout@v4

      - name: Download canonical runtime payload
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $env:RUNNER_TEMP 'canonical-artifact.zip'
          $dir = Join-Path $env:RUNNER_TEMP 'canonical-artifact'
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          Invoke-WebRequest -Headers $headers -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/artifacts/$env:CANONICAL_ARTIFACT_ID/zip" -OutFile $zip -MaximumRedirection 8
          Expand-Archive -LiteralPath $zip -DestinationPath $dir -Force
          $portable = Join-Path $dir 'release-assets\TNSuiteBridgeX_260820_v0.5-Build12-Hotfix17-Full.zip'
          if (-not (Test-Path -LiteralPath $portable)) { throw "CANONICAL_PORTABLE_MISSING=$portable" }
          New-Item -ItemType Directory -Force -Path (Join-Path $PWD 'dist'), (Join-Path $PWD 'dist-prev') | Out-Null
          Copy-Item -LiteralPath $portable -Destination (Join-Path $PWD 'dist\TNSuiteBridgeX_260820_v0.5-Build12-Hotfix17-Full.zip') -Force
          Copy-Item -LiteralPath $portable -Destination (Join-Path $PWD 'dist-prev\TNSuiteBridgeX_260820_v0.5-Build12-Hotfix17-Full.zip') -Force

      - name: Install pinned WiX extensions
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet tool install --global wix --version $env:WIX_VERSION
          if ($LASTEXITCODE -ne 0) { throw "WIX_TOOL_INSTALL_FAILED=$LASTEXITCODE" }
          wix extension add -g "WixToolset.BootstrapperApplications.wixext/$env:WIX_VERSION"
          if ($LASTEXITCODE -ne 0) { throw 'WIX_BAL_EXTENSION_INSTALL_FAILED' }
          wix extension add -g "WixToolset.Util.wixext/$env:WIX_VERSION"
          if ($LASTEXITCODE -ne 0) { throw 'WIX_UTIL_EXTENSION_INSTALL_FAILED' }
          wix --version

      - name: Build previous Hotfix22 baseline
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $portable = Join-Path $PWD 'dist-prev\TNSuiteBridgeX_260820_v0.5-Build12-Hotfix17-Full.zip'
          & pwsh.exe -NoLogo -NoProfile -File .\.release\build-wix-installer-hotfix22.ps1 -PortableZip $portable -OutputDirectory (Join-Path $PWD 'dist-prev')
          if ($LASTEXITCODE -ne 0) { throw "HOTFIX22_BASELINE_BUILD_FAILED=$LASTEXITCODE" }
          $setup = Join-Path $PWD 'dist-prev\TNSuiteBridgeX_260820_v0.5-Build12-Hotfix22-WiX-Setup.exe'
          if (-not (Test-Path -LiteralPath $setup)) { throw 'HOTFIX22_BASELINE_SETUP_MISSING' }

      - name: Build and statically validate Hotfix23 installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $portable = Join-Path $PWD 'dist\TNSuiteBridgeX_260820_v0.5-Build12-Hotfix17-Full.zip'
          $qa = Join-Path $PWD 'dist\TNSuiteBridgeX_260820_v0.5-Build12-Hotfix23-WiX-QA.txt'
          & pwsh.exe -NoLogo -NoProfile -File .\.release\build-wix-installer-hotfix23.ps1 -PortableZip $portable -OutputDirectory (Join-Path $PWD 'dist') 2>&1 | Tee-Object -FilePath $qa
          if ($LASTEXITCODE -ne 0) { throw "HOTFIX23_BUILD_FAILED=$LASTEXITCODE" }

          $setup = Join-Path $PWD 'dist\TNSuiteBridgeX_260820_v0.5-Build12-Hotfix23-WiX-Setup.exe'
          $msi = Join-Path $PWD 'dist\TNSuiteBridgeX_260820_v0.5-Build12-Hotfix23-WiX.msi'
          foreach ($artifact in @($setup,$msi)) {
            if (-not (Test-Path -LiteralPath $artifact)) { throw "ARTIFACT_MISSING=$artifact" }
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $artifact).Hash.ToLowerInvariant()
            "ARTIFACT_SHA256 file=$([IO.Path]::GetFileName($artifact)) sha256=$hash" | Tee-Object -FilePath $qa -Append
          }

          $qaText = Get-Content -LiteralPath $qa -Raw
          if ($qaText -match 'WIX1150') { throw 'UNSUPPORTED_WIX_BINDER_SYMBOL_WARNING_WIX1150' }
          foreach ($marker in @(
            'MAINTENANCE_STATE_DETECTION=PRODUCT_SEARCH',
            'EXISTING_INSTALL_PATH_DETECTION=MSI_COMPONENT_SEARCH',
            'EXISTING_INSTALL_PATH_COMPONENT={492A8EAC-6707-51E3-9723-967A6E4A94D9}',
            'PRE_INSTALLVALIDATE_AUTO_CLOSE_BRIDGEX=ENABLED',
            'AUTO_CLOSE_TARGETS=BridgeX.exe,BridgeX-CLI.exe',
            'RESTART_MANAGER=DISABLED',
            'INSTALL_BASE_MIGRATION=MSI_COMPONENT_DIRECTORY'
          )) {
            if (-not $qaText.Contains($marker)) { throw "HOTFIX23_BUILD_MARKER_MISSING=$marker" }
          }

          $theme = Get-Content -LiteralPath '.\.release\BridgeX.Hotfix23.Theme.xml' -Raw
          foreach ($required in @(
            'DetectedBridgeXMsiVersion',
            'TargetBridgeXMsiVersion',
            'InstallUpdateButton',
            'Button Name="RepairButton"',
            'Button Name="UninstallButton"',
            'VisibleCondition="NOT WixStdBASuppressOptionsUI AND NOT (DetectedBridgeXMsiVersion'
          )) {
            if ($theme -notmatch [regex]::Escape($required)) { throw "MAINTENANCE_THEME_BINDING_MISSING=$required" }
          }
          Write-Host 'MAINTENANCE_THEME_INSTALL_UPDATE_REPAIR_UNINSTALL=PASS'
          Write-Host 'UPDATE_LOCATION_CHANGE_UI=LOCKED'
          Write-Host 'WIX1150=NONE'

      - name: Upgrade Hotfix22 to Hotfix23 and preserve selected location
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          function Invoke-SetupWithTimeout {
            param(
              [Parameter(Mandatory=$true)][string]$FilePath,
              [Parameter(Mandatory=$true)][string[]]$ArgumentList,
              [int]$TimeoutSeconds = 180
            )
            $process = Start-Process -FilePath $FilePath -ArgumentList $ArgumentList -PassThru
            if (-not $process.WaitForExit($TimeoutSeconds * 1000)) {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
              throw "SETUP_UI_TIMEOUT_POSSIBLE_FILES_IN_USE_DIALOG pid=$($process.Id)"
            }
            $process.Refresh()
            return $process.ExitCode
          }

          $oldSetup = Join-Path $PWD 'dist-prev\TNSuiteBridgeX_260820_v0.5-Build12-Hotfix22-WiX-Setup.exe'
          $newSetup = Join-Path $PWD 'dist\TNSuiteBridgeX_260820_v0.5-Build12-Hotfix23-WiX-Setup.exe'
          $defaultRoot = Join-Path $env:ProgramFiles 'TNSuite\BridgeX'
          $base = Join-Path $env:RUNNER_TEMP 'BridgeX-Hotfix23-UpgradeBase'
          $root = Join-Path $base 'TNSuite\BridgeX'
          $exe = Join-Path $root 'bin\BridgeX.exe'

          foreach ($path in @($root,$defaultRoot)) { if (Test-Path -LiteralPath $path) { Remove-Item -LiteralPath $path -Recurse -Force } }
          New-Item -ItemType Directory -Force -Path $base | Out-Null

          $oldInstall = Start-Process -FilePath $oldSetup -ArgumentList @('/quiet','/norestart',("InstallFolder={0}" -f $base),'CreateDesktopShortcut=0','LaunchAfterInstall=0') -Wait -PassThru
          if ($oldInstall.ExitCode -notin @(0,3010)) { throw "HOTFIX22_INSTALL_FAILED=$($oldInstall.ExitCode)" }
          if (-not (Test-Path -LiteralPath $exe)) { throw 'HOTFIX22_CUSTOM_LOCATION_MISSING' }
          if (Test-Path -LiteralPath (Join-Path $defaultRoot 'bin\BridgeX.exe')) { throw 'HOTFIX22_CUSTOM_LOCATION_PRECONDITION_FELL_BACK_TO_C' }

          $app = Start-Process -FilePath $exe -WorkingDirectory (Split-Path -Parent $exe) -PassThru
          Start-Sleep -Seconds 3
          if ($app.HasExited) { throw 'UPDATE_RUNNING_APP_PRECONDITION_FAIL' }

          $log = Join-Path $env:RUNNER_TEMP 'Hotfix23-update.log'
          $updateExit = Invoke-SetupWithTimeout -FilePath $newSetup -ArgumentList @('/passive','/norestart','LaunchAfterInstall=0','/log',("`"{0}`"" -f $log))
          if ($updateExit -ne 0) { throw "HOTFIX23_UPDATE_FAILED_OR_REBOOT_REQUIRED=$updateExit" }

          $app.Refresh()
          if (-not $app.HasExited) { throw 'UPDATE_DID_NOT_FORCE_CLOSE_RUNNING_BRIDGEX' }
          if (-not (Test-Path -LiteralPath $exe)) { throw "UPDATE_DID_NOT_PRESERVE_CUSTOM_LOCATION expected=$exe" }
          if (Test-Path -LiteralPath (Join-Path $defaultRoot 'bin\BridgeX.exe')) { throw 'UPDATE_FELL_BACK_TO_C_DEFAULT' }
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $exe).Hash.ToLowerInvariant()
          if ($hash -ne $env:EXPECTED_BRIDGEX_SHA256) { throw "UPDATED_RUNTIME_HASH_FAIL=$hash" }

          Write-Host 'OLDER_VERSION_DETECTED_AND_UPDATED=PASS'
          Write-Host "UPDATE_PRESERVED_CUSTOM_LOCATION=PASS path=$root"
          Write-Host 'UPDATE_RUNNING_BRIDGEX_FORCE_CLOSED=PASS'
          Write-Host 'UPDATE_FILES_IN_USE_MODAL=NONE'
          Write-Host 'UPDATE_REBOOT_REQUIRED=NO'

      - name: Same-version repair closes app and uninstall cleans managed install
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          function Invoke-SetupWithTimeout {
            param(
              [Parameter(Mandatory=$true)][string]$FilePath,
              [Parameter(Mandatory=$true)][string[]]$ArgumentList,
              [int]$TimeoutSeconds = 180
            )
            $process = Start-Process -FilePath $FilePath -ArgumentList $ArgumentList -PassThru
            if (-not $process.WaitForExit($TimeoutSeconds * 1000)) {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
              throw "SETUP_UI_TIMEOUT_POSSIBLE_FILES_IN_USE_DIALOG pid=$($process.Id)"
            }
            $process.Refresh()
            return $process.ExitCode
          }

          $setup = Join-Path $PWD 'dist\TNSuiteBridgeX_260820_v0.5-Build12-Hotfix23-WiX-Setup.exe'
          $base = Join-Path $env:RUNNER_TEMP 'BridgeX-Hotfix23-UpgradeBase'
          $root = Join-Path $base 'TNSuite\BridgeX'
          $exe = Join-Path $root 'bin\BridgeX.exe'

          if (-not (Test-Path -LiteralPath $exe)) { throw 'REPAIR_PRECONDITION_INSTALL_MISSING' }
          $app = Start-Process -FilePath $exe -WorkingDirectory (Split-Path -Parent $exe) -PassThru
          Start-Sleep -Seconds 3
          if ($app.HasExited) { throw 'REPAIR_RUNNING_APP_PRECONDITION_FAIL' }

          $repairLog = Join-Path $env:RUNNER_TEMP 'Hotfix23-repair.log'
          $repairExit = Invoke-SetupWithTimeout -FilePath $setup -ArgumentList @('/repair','/passive','/norestart','LaunchAfterInstall=0','/log',("`"{0}`"" -f $repairLog))
          if ($repairExit -ne 0) { throw "REPAIR_FAILED_OR_REBOOT_REQUIRED=$repairExit" }
          $app.Refresh()
          if (-not $app.HasExited) { throw 'REPAIR_DID_NOT_FORCE_CLOSE_RUNNING_BRIDGEX' }
          if (-not (Test-Path -LiteralPath $exe)) { throw 'REPAIR_REMOVED_RUNTIME_UNEXPECTEDLY' }
          if (Test-Path -LiteralPath (Join-Path $env:ProgramFiles 'TNSuite\BridgeX\bin\BridgeX.exe')) { throw 'REPAIR_FELL_BACK_TO_C_DEFAULT' }
          Write-Host 'SAME_VERSION_REPAIR=PASS'
          Write-Host 'REPAIR_RUNNING_BRIDGEX_FORCE_CLOSED=PASS'
          Write-Host 'REPAIR_FILES_IN_USE_MODAL=NONE'

          $app2 = Start-Process -FilePath $exe -WorkingDirectory (Split-Path -Parent $exe) -PassThru
          Start-Sleep -Seconds 3
          if ($app2.HasExited) { throw 'UNINSTALL_RUNNING_APP_PRECONDITION_FAIL' }

          $uninstallLog = Join-Path $env:RUNNER_TEMP 'Hotfix23-uninstall.log'
          $uninstallExit = Invoke-SetupWithTimeout -FilePath $setup -ArgumentList @('/uninstall','/passive','/norestart','/log',("`"{0}`"" -f $uninstallLog))
          if ($uninstallExit -ne 0) { throw "UNINSTALL_FAILED_OR_REBOOT_REQUIRED=$uninstallExit" }
          $app2.Refresh()
          if (-not $app2.HasExited) { throw 'UNINSTALL_DID_NOT_FORCE_CLOSE_RUNNING_BRIDGEX' }
          if (Test-Path -LiteralPath $exe) { throw 'MANAGED_EXE_REMAINS_AFTER_UNINSTALL' }
          if (Test-Path -LiteralPath 'HKLM:\Software\TNSuite\BridgeX') { throw 'INSTALLER_REGISTRY_REMAINS_AFTER_UNINSTALL' }
          if (Test-Path -LiteralPath $root) {
            $remaining = @(Get-ChildItem -LiteralPath $root -Recurse -Force -ErrorAction SilentlyContinue)
            if ($remaining.Count -gt 0) { throw "INSTALL_ROOT_NOT_CLEAN remaining=$($remaining.Count)" }
            Remove-Item -LiteralPath $root -Force -ErrorAction SilentlyContinue
          }
          if (Test-Path -LiteralPath $base) { Remove-Item -LiteralPath $base -Recurse -Force -ErrorAction SilentlyContinue }

          Write-Host 'SAME_VERSION_UNINSTALL=PASS'
          Write-Host 'UNINSTALL_RUNNING_BRIDGEX_FORCE_CLOSED=PASS'
          Write-Host 'UNINSTALL_FILES_IN_USE_MODAL=NONE'
          Write-Host 'MANAGED_INSTALL_CLEANUP=PASS'
          Write-Host 'REBOOT_REQUIRED=NO'

      - name: Upload Hotfix23 candidate
        uses: actions/upload-artifact@v4
        with:
          name: bridgex-wix-hotfix23-${{ github.event.pull_request.head.sha }}
          path: |
            dist/TNSuiteBridgeX_260820_v0.5-Build12-Hotfix23-WiX.msi
            dist/TNSuiteBridgeX_260820_v0.5-Build12-Hotfix23-WiX-Setup.exe
            dist/TNSuiteBridgeX_260820_v0.5-Build12-Hotfix23-WiX-QA.txt
          if-no-files-found: error
          retention-days: 7
