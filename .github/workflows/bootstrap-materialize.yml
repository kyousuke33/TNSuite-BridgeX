name: Materialize BridgeX bootstrap
on:
  push:
    branches: [agent/governed-desktop-bootstrap]
permissions:
  contents: write
jobs:
  materialize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct canonical source
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/payload.part* | base64 -d > /tmp/bridgex-bootstrap.tar.xz
          tar -xJf /tmp/bridgex-bootstrap.tar.xz -C .
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-materialize.yml
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Bootstrap governed BridgeX desktop source'
          git push origin HEAD:agent/governed-desktop-bootstrap
