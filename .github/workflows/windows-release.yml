name: BridgeX Windows Release

on:
  workflow_call:
    inputs:
      source_sha:
        description: Exact source SHA to build
        required: true
        type: string
      publish_release:
        description: Legacy publication switch; must remain false while verified-artifact promotion is enforced
        required: true
        type: boolean

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout exact source SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}

      - name: Validate release request
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $request = Get-Content '.release/release-request.json' -Raw | ConvertFrom-Json
          if ($request.schema -ne 'tnsuite.bridgex.release-request.v1') { throw 'RELEASE_REQUEST_SCHEMA_INVALID' }
          if ($request.channel -ne 'github-releases') { throw 'RELEASE_CHANNEL_INVALID' }
          if ($request.tag -ne 'v0.5-Build12-Hotfix17') { throw 'RELEASE_TAG_INVALID' }
          if ($request.build_name -ne 'TNSuiteBridgeX_260820_v0.5-Build12-Hotfix17-Full') { throw 'BUILD_NAME_INVALID' }
          if ($request.rcp_profile -ne 'tnsuite.public-desktop-github-release.v1') { throw 'RCP_RELEASE_PROFILE_INVALID' }
          if ($request.rcp_authority_sha -notmatch '^[0-9a-f]{40}$') { throw 'RCP_AUTHORITY_SHA_INVALID' }

          $sourceSha = '${{ inputs.source_sha }}'
          $callerSha = '${{ github.sha }}'
          if ($sourceSha -notmatch '^[0-9a-f]{40}$') { throw 'SOURCE_SHA_INVALID' }
          if ($callerSha -notmatch '^[0-9a-f]{40}$') { throw 'CALLER_SHA_INVALID' }
          if ($sourceSha -ne $callerSha) { throw 'SOURCE_SHA_CALLER_MISMATCH' }

          "BRIDGEX_RELEASE_TAG=$($request.tag)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "BRIDGEX_RELEASE_TITLE=$($request.title)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "BUILD_NAME=$($request.build_name)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RCP_RELEASE_PROFILE=$($request.rcp_profile)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RCP_AUTHORITY_SHA=$($request.rcp_authority_sha)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "BRIDGEX_SOURCE_SHA=$sourceSha" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host 'REMEDIATION_RELEASE_IDENTITY=Build12-Hotfix17'
          Write-Host 'WITHDRAWN_HOTFIX16_IDENTITY_REUSED=NO'

      - name: Determine execution mode
        id: plan
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ('${{ inputs.publish_release }}' -eq 'true') {
            throw 'DIRECT_PUBLICATION_DISABLED_USE_VERIFIED_ARTIFACT_PROMOTION'
          }
          'build=true' | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          'publish=false' | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host 'WINDOWS_RELEASE_MODE=BUILD_EVIDENCE_ONLY'
          Write-Host 'PUBLICATION_PAUSED=YES'

      - name: Build Windows installer and portable archive
        if: steps.plan.outputs.build == 'true'
        shell: pwsh
        run: |
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\.release\windows-build-adapter.ps1
          if ($LASTEXITCODE -ne 0) { throw "WINDOWS_BUILD_FAILED=$LASTEXITCODE" }
          Write-Host 'WINDOWS_COMPILE_QA=PASS'
          Write-Host 'INSTALLER_BUILD_QA=PASS'
          Write-Host 'PORTABLE_BUILD_QA=PASS'

      - name: Prepare immutable release assets
        if: steps.plan.outputs.build == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $assets = Join-Path $PWD 'release-assets'
          New-Item -ItemType Directory -Force -Path $assets | Out-Null

          $setup = Join-Path $PWD "dist\$env:BUILD_NAME-Setup.exe"
          $portable = Join-Path $PWD "dist\$env:BUILD_NAME.zip"
          if (-not (Test-Path -LiteralPath $setup)) { throw "INSTALLER_MISSING=$setup" }
          if (-not (Test-Path -LiteralPath $portable)) { throw "PORTABLE_MISSING=$portable" }

          $withdrawnSetup = Join-Path $PWD 'dist\TNSuiteBridgeX_260818_v0.5-Build12-Hotfix16-Full-Setup.exe'
          $withdrawnPortable = Join-Path $PWD 'dist\TNSuiteBridgeX_260818_v0.5-Build12-Hotfix16-Full.zip'
          if ((Test-Path -LiteralPath $withdrawnSetup) -or (Test-Path -LiteralPath $withdrawnPortable)) {
            throw 'WITHDRAWN_HOTFIX16_ARTIFACT_RECREATED'
          }

          $setupVersion = (Get-Item -LiteralPath $setup).VersionInfo.FileVersion
          if ($setupVersion -ne '0.5.12.17') {
            throw "INSTALLER_FILE_VERSION_MISMATCH=$setupVersion"
          }
          Write-Host 'INSTALLER_FILE_VERSION_QA=PASS version=0.5.12.17'

          Copy-Item -LiteralPath $setup -Destination $assets
          Copy-Item -LiteralPath $portable -Destination $assets

          $setupName = Split-Path -Leaf $setup
          $portableName = Split-Path -Leaf $portable
          $setupHash = (Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $assets $setupName)).Hash.ToLowerInvariant()
          $portableHash = (Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $assets $portableName)).Hash.ToLowerInvariant()
          $sumText = "$setupHash *$setupName`n$portableHash *$portableName`n"
          [System.IO.File]::WriteAllText((Join-Path $assets 'SHA256SUMS.txt'), $sumText, [System.Text.Encoding]::ASCII)

          Write-Host "INSTALLER_SHA256=$setupHash"
          Write-Host "PORTABLE_SHA256=$portableHash"
          Write-Host 'RELEASE_ASSET_SHA256=PASS'

      - name: Write release notes
        if: steps.plan.outputs.build == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $hashLines = Get-Content 'release-assets/SHA256SUMS.txt'
          if ($hashLines.Count -ne 2) { throw "SHA256_LINE_COUNT_INVALID=$($hashLines.Count)" }

          $notesLines = @(
            '# TNSuite BridgeX v0.5 Build12-Hotfix17',
            '',
            '**File transfer quen thuộc như FileZilla, nhưng có Dark Mode.**',
            '',
            'Build12-Hotfix17 là bản sửa lỗi đóng gói installer sau khi Build12-Hotfix16 bị thu hồi. Artifact ở bước này chỉ là bằng chứng build và chưa được phát hành công khai.',
            '',
            '## Tệp build',
            '',
            "- **Installer:** $env:BUILD_NAME-Setup.exe",
            "- **Portable:** $env:BUILD_NAME.zip",
            '- **Checksum:** SHA256SUMS.txt',
            '',
            '## Có gì trong bản này',
            '',
            '- Dark Mode / Light Mode;',
            '- ghi nhớ giao diện đã chọn;',
            '- English / Tiếng Việt;',
            '- SFTP / truyền tệp;',
            '- Windows installer và portable build;',
            '- CLI automation/SFTP có phạm vi giới hạn;',
            '- installer không còn nhúng/chạy PowerShell helper hoặc tự động terminate BridgeX;',
            '- installer dùng NSIS zlib thay cho solid LZMA.',
            '',
            '## SHA-256',
            ''
          )
          foreach ($line in $hashLines) {
            $notesLines += "    $line"
          }
          $notesLines += ''
          $notesLines += '**VirusTotal:** chờ kiểm tra lại đúng artifact từ protected main trước khi phát hành.'
          $notesLines += ''
          $notesLines += "**Source:** $env:BRIDGEX_SOURCE_SHA"
          $notesLines += ''
          $notesLines += '> BridgeX được phát triển độc lập từ FileZilla Client 3.70.6. Đây không phải sản phẩm chính thức của FileZilla Project.'

          $notes = [string]::Join("`n", $notesLines) + "`n"
          [System.IO.File]::WriteAllText((Join-Path $PWD 'release-notes.md'), $notes, [System.Text.UTF8Encoding]::new($false))
          Write-Host 'RELEASE_NOTES_RENDER_QA=PASS'

      - name: Upload build evidence artifact
        if: steps.plan.outputs.build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: bridgex-release-${{ inputs.source_sha }}
          path: |
            release-assets/*
            release-notes.md
          if-no-files-found: error
          retention-days: 30

      - name: Dry-run result
        if: steps.plan.outputs.build == 'true'
        shell: pwsh
        run: |
          Write-Host 'WINDOWS_RELEASE_DRY_RUN=PASS'
          Write-Host 'GITHUB_RELEASE_PUBLISHED=NOT_RUN_SECURITY_GATE'
          Write-Host 'PUBLICATION_PAUSED=YES'
          Write-Host 'VIRUSTOTAL_EXACT_ARTIFACT_GATE=PENDING'
          Write-Host 'PRODUCTION_HOST_ACCESS=NONE'
          Write-Host 'DATABASE_EXECUTION=NOT_PERFORMED'
